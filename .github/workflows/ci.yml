# Author: Subash Karki
# First CI workflow for this repo. Deliberately minimal: run the test suite and
# the schema-doc drift gate on every PR and on push to main. Plain push /
# pull_request triggers only - no label/comment triggers, which can make a
# workflow retrigger itself.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install ripgrep (T4 recipe dependency)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: npm test
      - name: Validate portable Agent Skill boundary
        run: npm run validate:skill
      - name: Validate Agent Skills specification
        run: |
          python3 -m pip install 'git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref'
          skills-ref validate skills/phantom
      - name: Schema docs are in sync
        run: node scripts/gen-schema-docs.js --check
