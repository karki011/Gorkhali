# Author: Subash Karki
# CI workflow for the lean plugin surface. Deliberately minimal: install and
# run the test suite on every PR and on push to main. Plain push / pull_request
# triggers only - no label/comment triggers, which can make a workflow
# retrigger itself.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install
      - run: npm test
