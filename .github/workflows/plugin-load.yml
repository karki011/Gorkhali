# Author: Subash Karki
# Load-layer gate. The CI workflow proves the test suite passes; this one
# proves the plugin the repo describes actually LOADS in Claude Code.
#
# The two are not the same check. A malformed hooks/hooks.json passes every one
# of the unit tests and still leaves the installed plugin at "failed to load",
# because nothing in the suite parses hooks.json the way the host does.
name: plugin load

on:
  pull_request:
    paths:
      - .claude-plugin/**
      - hooks/**
      - skills/**
      - commands/**
      - agents/**
      - lib/**
      - .github/workflows/plugin-load.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: every hook and lib entry point parses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Parse every JS entry point
        run: |
          set -euo pipefail
          status=0
          for file in hooks/*.js hooks/*.mjs hooks/*.cjs lib/*.js; do
            [ -e "$file" ] || continue
            node --check "$file" || { echo "::error file=$file::does not parse"; status=1; }
          done
          exit $status

  load:
    name: plugin reaches enabled
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Install the plugin from this checkout into a scratch config
        run: |
          set -euo pipefail
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-scratch"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          # `plugin install` exits 0 even when the plugin later fails to load
          # (verified against a malformed hooks.json), so its exit code is not
          # the assertion — the status line below is.
          claude plugin install gorkhali@gorkhali
          claude plugin list | tee plugin-list.txt
          # The status glyph is terminal-dependent (✔ or √), so match the word.
          grep -qE '^[[:space:]]*Status:.*enabled' plugin-list.txt || {
            echo "::error::gorkhali did not reach \"enabled\" from this checkout; see the plugin list output above"
            exit 1
          }
